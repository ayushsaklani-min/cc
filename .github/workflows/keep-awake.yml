name: keep-awake

# The hosted demo's backend runs on a free plan that sleeps after about 15 idle
# minutes, so a visitor's first request would wait a minute for it to wake.
# This asks it for its public config every ten minutes. GitHub may delay
# scheduled runs, so it lowers the chance of a cold start rather than removing it.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - run: curl --silent --show-error --fail --max-time 120 --output /dev/null https://ciphercomply-api.onrender.com/api/v1/config
